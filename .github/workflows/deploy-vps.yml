# Deploy to production VPS (stylehomesusa.com) only when pushing to main.
# Pushes to develop or other branches do NOT trigger this workflow.
#
# Required GitHub Secrets: VPS_HOST, VPS_USER, SSH_PRIVATE_KEY
# Server: deploy user must be able to run sudo cp -r dist/* /var/www/stylehomes/

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/stylehome-wix-clone
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/stylehomes/
            echo "Deploy done."
